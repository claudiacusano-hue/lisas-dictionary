name: GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build del sito
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/lisas-dictionary/' }}
          # Parametri pubblici del client; le variabili del repository possono sostituirli.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bodecqhevwwwykuntsxg.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ROj9kZiRTHD1kY1DMB7sjQ_6I-ubdn-' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CONTRIBUTIONS_ENABLED: ${{ vars.VITE_CONTRIBUTIONS_ENABLED || 'false' }}
          VITE_PRIVACY_CONTROLLER: ${{ vars.VITE_PRIVACY_CONTROLLER }}
          VITE_PRIVACY_CONTACT: ${{ vars.VITE_PRIVACY_CONTACT }}
          VITE_PRIVACY_RETENTION: ${{ vars.VITE_PRIVACY_RETENTION }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
